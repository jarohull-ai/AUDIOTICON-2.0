name: CI

on:
  push:
    branches: [ main, backup/**, docs/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend Rust Tests & Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & index
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies (FFmpeg & audio tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg sox libsox-fmt-all espeak-ng

      - name: Compile and check backend targets
        working-directory: backend
        run: cargo check --workspace --all-targets --verbose

      - name: Run Clippy linter (advisory)
        working-directory: backend
        run: cargo clippy --workspace --all-targets

      - name: Run Backend Unit & Integration Tests (221 tests)
        working-directory: backend
        run: cargo test --workspace --verbose

  ui:
    name: Qt6 C++ & QML Offscreen Test Suite
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt 6 & Multimedia dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-multimedia-dev \
            libgl1-mesa-dev \
            libglx-dev \
            libopengl-dev \
            ffmpeg \
            sox

      - name: Build Rust bridge static library for UI linking
        working-directory: backend
        run: cargo build --release --package audioticon-bridge

      - name: Build and execute Qt test suite (offscreen QPA)
        run: |
          mkdir -p ui/build-tests
          cd ui/build-tests
          qmake6 ../tests/tests.pro CONFIG+=release
          make -j$(nproc)
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software ./tests

      - name: Build standalone console application
        run: |
          mkdir -p ui/build-console
          cd ui/build-console
          qmake6 ../agent-console.pro CONFIG+=release
          make -j$(nproc)
